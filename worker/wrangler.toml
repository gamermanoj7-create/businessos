name = "businessos-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

# Runs hourly; the handler decides which reminders are actually due "today".
[triggers]
crons = ["0 * * * *"]

[vars]
APP_ENV = "production"

# Set with: wrangler secret put <NAME>
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   SUPABASE_JWT_SECRET
#   WHATSAPP_TOKEN
#   WHATSAPP_PHONE_NUMBER_ID
#   WHATSAPP_VERIFY_TOKEN
